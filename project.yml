# The Xcode project, as text.
#
# Generated with `xcodegen generate` rather than committed as a .xcodeproj,
# because the project file is a merge conflict waiting to happen and nobody
# reads it anyway. Everything worth knowing about the build is here.
name: sesh
options:
  bundleIdPrefix: us.liyifan.sesh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: ""          # set this to your team, or sign manually in Xcode
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  SeshCore:
    path: Packages/SeshCore
  SeshStore:
    path: Packages/SeshStore
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0

targets:
  sesh:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SeshCore
        product: SeshCore
      - package: SeshStore
        product: SeshStore
      - target: SeshWidgets
        embed: true
      - target: SeshWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.liyifan.sesh
        INFOPLIST_KEY_CFBundleDisplayName: sesh
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # The timer's alarms are local, so the app needs no push entitlement at all.
        INFOPLIST_KEY_UIBackgroundModes: fetch processing
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: sesh
        # From the build settings rather than baked in, which xcodegen otherwise
        # does — so `CURRENT_PROJECT_VERSION=…` on the command line can give each
        # TestFlight upload the unique build number it has to have.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch, processing]
        # Must match SeshApp.refreshTaskId, or the scheduler silently refuses it.
        BGTaskSchedulerPermittedIdentifiers: [us.liyifan.sesh.refresh]
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # HTTPS through URLSession and nothing else, which is exempt — saying so
        # here saves answering the export-compliance question on every build.
        ITSAppUsesNonExemptEncryption: false

  seshTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: sesh
      - package: SeshCore
        product: SeshCore
      - package: SeshStore
        product: SeshStore
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.liyifan.sesh.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/sesh.app/sesh
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

  SeshWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SeshWidgets
      # Shared so the app and the widget cannot disagree about the payload.
      - path: App/Timer/SeshActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.liyifan.sesh.widgets
        SKIP_INSTALL: YES
    info:
      path: SeshWidgets/Info.plist
      properties:
        CFBundleDisplayName: sesh
        # Must match the app's, or the upload is refused.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SeshWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: SeshWatch
      - path: WatchShared
    dependencies:
      - package: SeshCore
        product: SeshCore
      - target: SeshWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.liyifan.sesh.watch
        CODE_SIGN_ENTITLEMENTS: SeshWatch/SeshWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    info:
      path: SeshWatch/Info.plist
      properties:
        CFBundleDisplayName: sesh
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: us.liyifan.sesh
        WKRunsIndependentlyOfCompanionApp: true
        WKSupportsLiveActivityLaunchAttributeTypes: []
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [sesh-watch]

  SeshWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: SeshWatchWidgets
      - path: WatchShared
    dependencies:
      - package: SeshCore
        product: SeshCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.liyifan.sesh.watch.widgets
        CODE_SIGN_ENTITLEMENTS: SeshWatchWidgets/SeshWatchWidgets.entitlements
        SKIP_INSTALL: YES
    info:
      path: SeshWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Sesh timer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  sesh:
    build:
      targets:
        sesh: all
    test:
      targets: [seshTests]
      environmentVariables:
        SESH_QA_SERVER_URL: http://127.0.0.1:3039
        SESH_SHARED_E2E: $(SESH_SHARED_E2E)
  SeshWatch:
    build:
      targets:
        SeshWatch: all
